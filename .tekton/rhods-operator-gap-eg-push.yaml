apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/rhods-operator-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files here, on purpose.  The
    # release push pipeline nudges downstream repos with the digest it just
    # built; an early-gate build is a throwaway validation of an ephemeral
    # branch and must never open nudge PRs anywhere.
    #
    # Two pushes land on the ephemeral branch: the one that creates it, and the
    # one operator-processor makes once it has pinned every component digest.
    # Only the second is worth building - the first is just a fork of
    # main/stable that the release pipelines already cover.
    #
    # Two clauses select it, because neither alone covers both shapes the
    # processor's commit can take:
    #
    #   pathChanged  - the ordinary case.  Pinning the digests is what rewrites
    #                  build/operands-map.yaml, so a change there is the
    #                  processor's signature.  A branch-creation push reports no
    #                  changed files, so it does not match.
    #   event_title  - the no-op case.  When the fork source was already current
    #                  the processor has nothing to write and commits with
    #                  --allow-empty, which touches no path at all, leaving the
    #                  message as the only thing to match on.  The
    #                  branch-creation push carries main/stable's tip message,
    #                  which never starts with "early-gate:": those commits are
    #                  only ever made on ephemeral branches, and ephemeral
    #                  branches are deleted rather than merged.
    #
    # The prefix is written in .github/workflows/operator-processor.yaml.  The
    # two have to change together.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-")
      && ("build/operands-map.yaml".pathChanged()
          || event_title.startsWith("early-gate:"))
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhods-operator-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-gap-eg-on-push
  namespace: rhoai-tenant
# ---------------------------------------------------------------------------
# Build configuration tracks odh-operator-v3-5-push.yaml on rhoai-3.5: same
# pipeline, same platforms, same hermetic/prefetch/source-image/index
# settings.  A gate that scans nothing and builds one architecture cannot
# stand in for a release build, so the differences from that file are only
# the ones the gate requires - output image, service account, trigger, and
# the absence of build-nudge-files.
#
# This was the x86_64-only, scan-free configuration while Blocks 1-3 were
# being brought up; run 5 spent 84 minutes with a 4-arch build sitting in the
# cluster queue, which bought nothing while the bundle path was the unknown.
# Expect the build to take substantially longer now.  That is the point.
# ---------------------------------------------------------------------------
spec:
  # 4h, as odh-operator-v3-5-push.yaml.  Was 90m while this built one
  # architecture and ran no scanners; a 4-arch build that queues can exceed
  # that legitimately, and killing it at 90m would look like a gate failure
  # rather than a busy cluster.
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  # The ephemeral branch's HEAD - i.e. the commit operator-processor pushed,
  # with every component pinned to the digests the leader PR is gating.  PaC
  # expands this from the push event, so unlike the standalone EG pipeline
  # there is no window in which the tag can name a different commit.
  - name: revision
    value: '{{revision}}'
  # additional-tags used to carry '{{target_branch}}-{{revision}}' alongside a
  # primary tag of eg-{{revision}}.  Those two now coincide - the branch-derived
  # form below *is* the primary tag - so a second copy would just be the same
  # string applied twice.
  #
  # quay.io/rhoai/pull-request-pipelines, not a release repo and not the POC
  # redhat-user-workloads one.  Every quay.io/rhoai release repo (odh-operator,
  # odh-operator-bundle, rhoai-fbc-fragment) is private, and monitor-pac-build
  # resolves the digest over an anonymous Quay pull token, so it cannot see
  # them.  pull-request-pipelines is public, is already where RHOAI puts
  # non-release build artifacts (see odh-operator-pull-request.yaml), and being
  # a different repo entirely it cannot collide with a release digest no matter
  # what the tag says.
  #
  # The repo is shared between components, which is why the tag leads with the
  # component name.
  #
  # The rest of the tag is {{target_branch}}-{{revision}}, and the branch is the
  # ephemeral eg-<leader-pr-number>, so this expands to
  # rhods-operator-eg-<leader-pr-number>-<40-char-sha>.  Deriving it from the
  # branch rather than hardcoding "eg-" is what enforces the eg- prefix at the
  # push point: the on-cel-expression below only fires for a target_branch
  # starting with eg-, so a tag without that prefix is unreachable here rather
  # than merely discouraged.  The ephemeral branch is deleted as soon as the
  # gate finishes, so this tag is what keeps the image addressable afterwards.
  #
  # odh-operator, not rhods-operator.  The prefix names the Konflux component
  # that produces the image, not the repository it is built from, and prod's
  # operator component is odh-operator: konflux-central's
  # pipelineruns/rhods-operator/.tekton/odh-operator-pull-request.yaml
  # publishes pull-request-pipelines:odh-operator-{{revision}}.  Until now
  # Block 1 was the only one of the three blocks not matching prod - Block 2
  # already tags odh-operator-bundle-, Block 3 rhoai-fbc-fragment- - which
  # made the shared repository look, in the gate's own PR comment, as though
  # the three blocks were unrelated to the components they build.
  #
  # The '{{target_branch}}-' in the middle is what keeps this clear of prod's
  # own PR builds, which tag odh-operator-{{revision}} with no branch segment.
  # The CEL above restricts this file to branches starting with eg-, so the
  # tag always expands to odh-operator-eg-...-<sha> and can never collide with
  # a prod PR tag, let alone a release one.
  #
  # Changing this string means changing image-tag on monitor-operator-build in
  # konflux-central's early-gate-component-pipeline.yaml in the same breath.
  # The monitor polls for a tag it reconstructs; the two must agree
  # character-for-character or the build succeeds, the poll 404s, and the gate
  # fails downstream on an empty digest instead of on the real cause.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-{{target_branch}}-{{revision}}
  # Required, not optional, now that this is back on the multi-arch pipeline:
  # that pipeline forwards rhoai-version to rhoai-init 0.1, which hard-fails a
  # non-pull_request run when it is empty.  container-build.yaml declares no
  # such param, which is why this line was absent while the file pointed
  # there.
  #
  # X.Y.Z, not the X.Y the gate's own rhoai-version parameter carries:
  # rhoai-init parses this into major/minor/patch to build a CPE ID.  The
  # value matches odh-operator-v3-5-push.yaml on rhoai-3.5.
  #
  # It is a literal because nothing here can derive it.  PaC expands
  # {{target_branch}} to the ephemeral eg-* branch, which names no release,
  # and this file lives on main/stable rather than on a release branch the
  # way prod's per-release push files do.  Bump it together with
  # rhoai-version in rhods-operator-gap-eg-build.yaml, which is what decides
  # the release for the rest of the run.
  - name: rhoai-version
    value: "3.5.2"
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  # No skip-checks.  multi-arch-container-build.yaml declares no such
  # parameter and runs clair-scan, sast-snyk-check, clamav-scan,
  # sast-shell-check, sast-unicode-check, deprecated-base-image-check,
  # ecosystem-cert-preflight-checks and rpms-signature-scan unconditionally.
  # Passing it would be a "param not declared in pipeline" error, not a
  # no-op; it existed here only because container-build.yaml gates all eight
  # on `when: $(params.skip-checks) in ["false"]`.
  - name: hermetic
    value: true
  # The gomod+rpm prefetch is what makes hermetic possible: cachi2 resolves
  # both trees up front so the build never reaches the network.  hermetic
  # true with this empty would fail to fetch dependencies rather than build
  # offline.  Byte-for-byte odh-operator-v3-5-push.yaml's value.
  - name: prefetch-input
    value: |
      [
        {
          "type": "gomod",
          "path": "."
        },
        {
          "type": "rpm",
          "path": "."
        }
      ]
  - name: build-source-image
    value: true
  # true, and required by the platform list below rather than merely matching
  # release: four architectures need an index manifest to be addressable by a
  # single digest, which is the digest Block 2 pins the bundle to.
  - name: build-image-index
    value: true
  # x86_64 only, and this is the one place the gate deliberately builds
  # less than release does.  odh-operator-v3-5-push.yaml builds four:
  #
  #     linux/x86_64  linux/ppc64le  linux/s390x  linux-m2xlarge/arm64
  #
  # (linux-m2xlarge/arm64 is a Konflux instance type, not a typo for
  # linux/arm64 - the release file uses it for arm64 only.  Restore the
  # list above verbatim when reinstating the full set.)
  #
  # What the gate is asking is whether the proposed operand digests
  # assemble into a bundle and a catalog that are structurally sound.
  # That question is answered identically on one architecture and on
  # four; what the extra three buy is confidence that the operator
  # *compiles* elsewhere, which the release build already establishes
  # and which no component PR in the group can change.
  #
  # Run 21 measured the cost honestly: 27m32s for four architectures
  # with the full scanner set, against a 150-minute budget.  So this is
  # not a change forced by the operator leg - it is headroom bought back
  # for the pipeline as a whole, whose 6h ceiling run 21 exceeded on the
  # FBC leg.
  #
  # build-image-index stays true below.  With one platform the index is
  # a single-entry manifest list rather than a four-entry one, but it is
  # still what carries the bare tag, and the bare tag is what
  # monitor-operator-build polls and what Block 2 pins against.  Setting
  # it false here would push only odh-operator-...-linux-x86-64 and the
  # monitor would 404 - that is run 13, on the FBC leg.
  - name: build-platforms
    value:
    - linux/x86_64
  # No enable-slack-failure-notification either, and nothing is lost by it.
  # multi-arch-container-build.yaml does not declare the parameter because it
  # has no send-slack-notification task to suppress - the pipeline documents
  # that it deliberately omits the finally block container-build.yaml carries.
  # The gate's own failure reporting is comment-on-leader-pr-failure, which is
  # unaffected.
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}': target_branch here is
    # the ephemeral eg-* branch, which exists in the operator repo only and
    # would never resolve against this repo.
    - name: revision
      value: 'main'
    # multi-arch-container-build.yaml, as odh-operator-v3-5-push.yaml uses.
    # container-build.yaml, which this pointed at while iterating, declares no
    # build-platforms parameter at all and builds x86_64 only - so the four
    # platforms above are not merely unset there, they are unsettable, and
    # passing them would be a validation error rather than a slow build.
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    # Not build-pipeline-rhods-operator-gap.  Konflux mints a Component's push
    # credential from that Component's containerImage, so the gap SA can push
    # to quay.io/redhat-user-workloads/rhoai-tenant/rhods-operator-gap and
    # nowhere else - against the output-image above it would 401 at push.
    #
    # This is the SA of the pull-request-pipelines Component, which already
    # holds a push credential for that repository; odh-operator-pull-request.yaml
    # uses it for the same reason.  Borrowing another Component's SA to reach a
    # shared repository is the established pattern here, not a workaround.
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
