apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/rhods-operator-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Opt-in only.  'on-event: [pull_request]' used to make this fire on every
    # PR event; with it gone the pipeline runs solely when the
    # operator-processor workflow (or a human) posts /build-konflux, or when
    # one of the labels below is applied.  on-target-branch is dropped with
    # it - it only ever scoped the on-event matcher.
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
    pipelinesascode.tekton.dev/on-label: "[kfbuild-all, kfbuild-rhods-operator]"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
  labels:
    appstudio.openshift.io/application: automation
    appstudio.openshift.io/component: pull-request-pipelines-odh-operator
    pipelines.appstudio.openshift.io/type: build
  name: odh-operator-on-pull-request-84392
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    # Floating "latest build for this PR", so a consumer can track a PR
    # without knowing the commit.
    - 'odh-operator-pr-{{pull_request_number}}'
    - 'pr-{{pull_request_number}}-into-{{target_branch}}'
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-operator
  # Carries the PR number as well as the commit.  The previous tag was keyed
  # on {{revision}} alone, so the same commit built from two PRs (or from a
  # branch and a PR) collided on one tag.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-pr-{{pull_request_number}}-{{revision}}
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux-m2xlarge/arm64
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [{"type": "gomod", "path": "."}, {"type": "rpm", "path": "."}]
  - name: build-image-index
    value: true
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central-gap.git
    # Pinned to main: the POC target branch (gap-poc) does not exist in
    # konflux-central-gap, so '{{ target_branch }}' would not resolve.
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
