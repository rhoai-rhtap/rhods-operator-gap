apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/rhods-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Opt-in, not on-open: Konflux generates a plain `event == "pull_request"`, which builds the unpinned tree before operator-processor has resolved component digests and prefetched manifests
    # Waiting for /build-konflux, which the workflow posts as its last step, means the only build that runs is the one against the pinned, prefetched tree
    # Same shape as .tekton/early-gate-ci-build.yaml, which drives its builds off /early-gate the same way
    pipelinesascode.tekton.dev/on-event: "[issue_comment]"
    pipelinesascode.tekton.dev/on-comment: "^/build-konflux"
  # TODO(prod): Konflux Components are immutable, so these three cannot be renamed.
  # This file builds a POC-only Component into a redhat-user-workloads repository;
  # a dedicated Component has to be created in the production tenant, or the file
  # dropped in favour of the existing odh-operator-pull-request.yaml.
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhods-operator-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-gap-on-pull-request
  namespace: rhoai-tenant
spec:
  # Parity with konflux-central's odh-operator-pull-request.yaml. The Tekton default is 1h; a hermetic four-platform build can pass that on a slow arm64/s390x runner.
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Carries the PR number as well as the commit, so the same commit built from two PRs does not collide on one tag
  # TODO(prod): Konflux mints the push credential from the Component's own
  # containerImage, so this repository is fixed by whichever Component is created.
  - name: output-image
    value: quay.io/redhat-user-workloads/rhoai-tenant/rhods-operator-gap:on-pr-{{pull_request_number}}-{{revision}}
  - name: additional-tags
    value:
    # Floating "latest build for this PR".
    - 'on-pr-{{pull_request_number}}'
    - 'pr-{{pull_request_number}}-into-{{target_branch}}'
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-operator
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux-m2xlarge/arm64
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [{"type": "gomod", "path": "."}, {"type": "rpm", "path": "."}]
  - name: build-image-index
    value: true
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # Pinned to main. Konflux generates '{{ target_branch }}', which works for rhoai-X.Y branches because konflux-central carries one branch per release.
    # TODO(prod): against a release branch '{{ target_branch }}' is the correct
    # value; this pin exists only because the POC branch has no counterpart there.
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    # Must be the Component's own SA: build-pipeline-pull-request-pipelines carries the push credential for quay.io/rhoai/pull-request-pipelines and none for the output-image above, so the build would succeed and then fail at push
    # TODO(prod): must be the SA of whichever Component is created.
    serviceAccountName: build-pipeline-rhods-operator-gap
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
