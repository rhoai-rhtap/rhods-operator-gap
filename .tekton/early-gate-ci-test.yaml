apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: "[issue_comment]"
    pipelinesascode.tekton.dev/on-comment: "^/early-gate-test$"
  labels:
    appstudio.openshift.io/application: early-gate
    appstudio.openshift.io/component: early-gate-ci
    pipelines.appstudio.openshift.io/type: test
  name: early-gate-ci-test
  # open-data-hub-tenant, not rhoai-tenant. The early-gate-ci Konflux Component
  # (application: early-gate) is registered in this tenant, and PaC submits the
  # PipelineRun to the Component's namespace. Pinning rhoai-tenant here made the
  # object namespace disagree with the request namespace, which Tekton rejects
  # with "the namespace of the provided object does not match the namespace sent
  # on the request". The rhods-operator-gap-eg-* files use rhoai-tenant because
  # they are a different Component (gap-poc), not because this one should.
  namespace: open-data-hub-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Which leader PR this test run belongs to. The early-gate-test-pipeline
  # requires these (no defaults), and resolve-gate-artifacts reads the
  # build-complete marker - the FBC digest the smoke test installs - from this
  # PR's comments. Hardcoded for the POC, mirroring rhods-operator-gap-eg-build.yaml,
  # because the Leader PR Manager that would supply them is not wired up yet.
  - name: leader-pr-repo
    value: "red-hat-data-services/gated-artifacts-promoter"
  - name: leader-pr-number
    value: "4"
  timeouts:
    pipeline: 6h
    tasks: 5h
  pipelineRef:
    resolver: git
    params:
    # RHOAI fork, not opendatahub-io. The test pipeline resolves components
    # against the RHOAI component_repo_map.json, which is the only one that
    # carries the rhods-operator entry.
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: early-gate/early-gate-test-pipeline.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-early-gate-ci
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
