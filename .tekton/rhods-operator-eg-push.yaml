apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/rhods-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files, on purpose: an early-gate build is a throwaway validation of an ephemeral branch and must never open nudge PRs anywhere
    # Two pushes land on the ephemeral branch - the one that creates it, and the one operator-processor makes once it has pinned every component digest - and only the second is worth building
    # pathChanged covers the ordinary case: pinning the digests rewrites build/operands-map.yaml, and a branch-creation push reports no changed files
    # event_title covers the no-op case: with nothing to write the processor commits --allow-empty, touching no path, leaving the message as the only thing to match on
    # A branch-creation push carries main/stable's tip message, which never starts with "early-gate:" - those commits are only ever made on ephemeral branches
    # The prefix is written in .github/workflows/operator-processor.yaml; the two have to change together
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-")
      && ("build/operands-map.yaml".pathChanged()
          || event_title.startsWith("early-gate:"))
  # TODO(prod): Konflux Components are immutable, so these three cannot be renamed.
  # A dedicated early-gate Component has to be created in the production tenant and
  # the application/component/name below set to it. build-check-name in
  # konflux-central's early-gate pipeline must be changed to match in the same breath.
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhods-operator-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhods-operator-gap-eg-on-push
  namespace: rhoai-tenant
# ---------------------------------------------------------------------------
# Build configuration tracks the release push file: same pipeline, same platforms,
# same hermetic/prefetch/source-image/index settings. A gate that scans nothing and
# builds one architecture cannot stand in for a release build, so the differences
# are only the ones the gate requires - output image, service account, trigger, and
# the absence of build-nudge-files.
# ---------------------------------------------------------------------------
spec:
  # 4h, as the release push file. Was 90m while this built one architecture and ran no scanners; a 4-arch build that queues can exceed that legitimately.
  timeouts:
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  # The ephemeral branch's HEAD - the commit operator-processor pushed, with every component pinned to the digests the leader PR is gating. PaC expands this from the push event, so the tag can never name a different commit.
  - name: revision
    value: '{{revision}}'
  # No additional-tags: the branch-derived form below is itself the primary tag, so a second copy would be the same string twice
  # pull-request-pipelines, not a release repo: every quay.io/rhoai release repo is private and monitor-pac-build resolves the digest over an anonymous Quay pull token, so it cannot see them
  # It is public, is already where RHOAI puts non-release build artifacts, and being a different repository it cannot collide with a release digest whatever the tag says
  # The repo is shared between components, which is why the tag leads with the component name
  # The rest is {{target_branch}}-{{revision}}, and the CEL above only fires for a branch starting with eg-, so the eg- prefix is enforced at the push point rather than by convention
  # The ephemeral branch is deleted as soon as the gate finishes, so this tag is what keeps the image addressable afterwards
  # odh-operator, not rhods-operator: the prefix names the Konflux component that produces the image, not the repository it is built from, and it matches what Blocks 2 and 3 do
  # The '{{target_branch}}-' segment keeps this clear of ordinary PR builds, which tag odh-operator-{{revision}} with no branch segment
  # Changing this string means changing image-tag on monitor-operator-build in konflux-central's early-gate pipeline in the same breath - the monitor reconstructs the tag rather than reading it
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-{{target_branch}}-{{revision}}
  # Required, not optional: multi-arch-container-build.yaml forwards rhoai-version to rhoai-init, which hard-fails a non-pull_request run when it is empty
  # X.Y.Z, not the X.Y the gate's own rhoai-version carries - rhoai-init parses it into major/minor/patch to build a CPE ID
  # A literal because nothing here can derive it: {{target_branch}} is the ephemeral branch, which names no release, and this file does not live on a release branch
  # TODO(prod): bump together with rhoai-version in the early-gate launcher PipelineRun, which decides the release for the rest of the run.
  - name: rhoai-version
    value: "3.5.2"
  - name: dockerfile
    value: Dockerfiles/Dockerfile.konflux
  - name: path-context
    value: .
  # No skip-checks: multi-arch-container-build.yaml declares no such parameter and runs its eight scanners unconditionally, so passing it would be a validation error rather than a no-op
  - name: hermetic
    value: true
  # The gomod+rpm prefetch is what makes hermetic possible: cachi2 resolves both trees up front so the build never reaches the network. Byte-for-byte the release push file's value.
  - name: prefetch-input
    value: |
      [
        {
          "type": "gomod",
          "path": "."
        },
        {
          "type": "rpm",
          "path": "."
        }
      ]
  - name: build-source-image
    value: true
  # true, and required by the platform list below: multiple architectures need an index manifest to be addressable by the single digest Block 2 pins the bundle to.
  - name: build-image-index
    value: true
  # TEMPORARY - x86_64 only, and this is the one place the gate deliberately
  # builds less than release does. Restore the four platforms below before this
  # is relied on; the same deviation exists on the FBC side and the two should
  # be reverted together.
  #
  #     linux/x86_64  linux/ppc64le  linux/s390x  linux-m2xlarge/arm64
  #
  # linux-m2xlarge/arm64 is a Konflux instance type, not a typo for linux/arm64 - the release file uses it for arm64 only, so restore the list verbatim
  # What the gate asks is whether the proposed operand digests assemble into a sound bundle and catalog, which is answered identically on one architecture and on four
  # build-image-index stays true above: at one platform the index is a single-entry manifest list, but it is still what carries the bare tag the monitor polls and Block 2 pins against
  - name: build-platforms
    value:
    - linux/x86_64
  # No enable-slack-failure-notification: multi-arch-container-build.yaml has no send-slack-notification task to suppress, and the gate's own failure reporting is comment-on-leader-pr-failure
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}': target_branch here is the ephemeral eg-* branch, which exists in the operator repo only
    - name: revision
      value: 'main'
    # multi-arch-container-build.yaml, as the release push file uses. container-build.yaml declares no build-platforms at all, so the platforms above would be a validation error there rather than a slow build.
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    # Konflux mints a Component's push credential from that Component's containerImage, so the early-gate Component's own SA would 401 against the output-image above
    # This is the SA of the pull-request-pipelines Component, which already holds a push credential for that repository - the established pattern for reaching a shared repo
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
