name: Operator Processor

on:
  workflow_dispatch:
    inputs:
      eg-mode:
        description: "Set to true when triggered from EG pipeline"
        required: false
        default: "false"
        type: string
      eg-branch:
        description: "Ephemeral branch name, eg-<leader-pr-number> (e.g. eg-44)"
        required: false
        default: ""
        type: string
      leader-pr-number:
        description: "Leader PR number for tagging"
        required: false
        default: ""
        type: string
      rhoai-version:
        description: >-
          RHOAI version to process against, as "3.5" or "rhoai-3.5".  Only
          consulted off a release branch - a push to rhoai-X.Y always uses its
          own name.  The early gate passes this; leaving it empty falls back to
          the newest rhoai-X.Y branch on the remote, which is a guess that
          changes meaning whenever a release branch is created or deleted.
        required: false
        default: ""
        type: string
  push:
    branches:
      - 'rhoai-[23].[0-9]'  # e.g. rhoai-2.1, rhoai-3.1, rhoai-3.4
      - 'rhoai-[23].[0-9][0-9]'  # e.g. rhoai-2.10, rhoai-3.10, rhoai-3.22
      - 'rhoai-[23].[0-9]-ea.[0-9]'  # e.g. rhoai-2.4-ea.1, rhoai-3.4-ea.1, rhoai-3.5-ea.2
      - 'rhoai-[23].[0-9][0-9]-ea.[0-9]'  # e.g. rhoai-2.10-ea.1, rhoai-3.10-ea.3
    paths:
      - build/operator-nudging.yaml
  # TODO(prod): the PR trigger below is POC-scoped - gap-poc does not exist in
  # red-hat-data-services/rhods-operator. It is dead rather than harmful there,
  # but pointing it at a release branch would make every PR run the processor.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - gap-poc


env:
  GITHUB_ORG: red-hat-data-services
  OPERATOR_REPO_NAME: rhods-operator
  RBC_REPO_NAME: RHOAI-Build-Config
  UTILS_REPO_NAME: RHOAI-Konflux-Automation
  # Branch to read bundle/bundle-patch.yaml from when the run is not on a release
  # branch. bundle/ does not exist on RBC main, so there is no fallback there.
  # TODO(prod): no production value is known. The natural candidate is the
  # computed release_branch, but that is a behaviour change - decide it
  # deliberately rather than carrying this value over.
  RBC_FALLBACK_BRANCH: gap-poc
  LOG_FILE_DIR: ${{ github.workspace }}
  LOG_FILE_NAME: operator-processor.log

permissions:
  contents: write
  pull-requests: write

# PR only: a rapid re-push should supersede the in-flight run. Non-PR runs get a unique group, so push behaviour is unchanged.
concurrency:
  group: operator-processor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  operator-processor:
    # The pull_request clause excludes github-actions[bot]: the commit-and-push step writes to the PR head branch, raising a 'synchronize' event whose actor is the bot, and without this the workflow would re-enter itself.
    if: ${{ github.ref_name != 'main' && (github.event_name == 'workflow_dispatch' || ( github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' ) || ( github.event_name == 'push' && github.event.commits[0].author.name == 'konflux-internal-p02[bot]' )) }}
    runs-on: ubuntu-latest
    steps:
      # Resolve every ref this run needs.
      #
      #   branch         the branch being processed (base branch for a PR)
      #   release_branch the rhoai-X.Y identity of the run.  Drives the Quay
      #                  tag filter, the component suffix and the manifest
      #                  branch.  A non-release branch defaults to the
      #                  highest rhoai-X.Y on the remote, matching how the
      #                  early-gate defaults behave.
      #   rbc_ref        branch to read bundle/bundle-patch.yaml from
      #   operator_ref   branch to check out and commit back to
      - name: Configure workflow parameters
        id: config
        env:
          ORG: ${{ env.GITHUB_ORG }}
          OPERATOR_REPO_NAME: ${{ env.OPERATOR_REPO_NAME }}
          RBC_FALLBACK_BRANCH: ${{ env.RBC_FALLBACK_BRANCH }}
          # Through the environment rather than a ${{ }} expansion inside the script: this value comes from a workflow_dispatch caller, and an expansion would splice it into the shell source before bash ever sees it.
          RHOAI_VERSION_INPUT: ${{ inputs.rhoai-version }}
        run: |
          set -euo pipefail

          # EG mode override, chained with the event-derived refs below: those assignments are unconditional, so a plain 'if' here would be overwritten on every EG run.
          if [[ "${{ inputs.eg-mode }}" == "true" ]]; then
            if [[ -z "${{ inputs.eg-branch }}" ]]; then
              echo "::error::eg-mode is true but eg-branch is empty. Pass the ephemeral branch name eg-<leader-pr-number> (e.g. eg-44)."
              exit 1
            fi
            BRANCH="${{ inputs.eg-branch }}"
            OPERATOR_REF="${{ inputs.eg-branch }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
            OPERATOR_REF="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
            OPERATOR_REF="${{ github.ref_name }}"
          fi

          if [[ "$BRANCH" =~ ^rhoai- ]]; then
            RELEASE_BRANCH="$BRANCH"
            RBC_REF="$BRANCH"
          elif [[ -n "${RHOAI_VERSION_INPUT}" ]]; then
            # "3.5" and "rhoai-3.5" both accepted - a caller should not have to know which spelling this workflow wants.
            RELEASE_BRANCH="rhoai-${RHOAI_VERSION_INPUT#rhoai-}"
            if [[ ! "$RELEASE_BRANCH" =~ ^rhoai-[23]\.[0-9]+$ ]]; then
              echo "::error::rhoai-version '${RHOAI_VERSION_INPUT}' is not an X.Y RHOAI version (expected e.g. 3.5 or rhoai-3.5)."
              exit 1
            fi
            RBC_REF="$RBC_FALLBACK_BRANCH"
            echo "::notice::Non-release branch '${BRANCH}' - version given explicitly as ${RELEASE_BRANCH}, RBC read from ${RBC_REF}"
          else
            # No explicit version, so guess - and the guess is load-bearing: RELEASE_BRANCH becomes the Quay tag every component image is looked up by, so when the newest rhoai-X.Y branch moves, so does the set of images that resolve.
            # Deleting a release branch once dropped the default two releases and the processor reported 55 of 120 components as "Images missing" - a branch deletion surfacing as what looks like a registry problem.
            # The early gate passes rhoai-version for exactly this reason; this path is for ordinary dev pushes, where being approximately right is good enough.
            # Strip the rhoai- prefix before sorting: "rhoai-2" and "rhoai-3" both sort numerically as 0, so sorting whole branch names picks rhoai-2.25 over rhoai-3.5. Majors are limited to 2 and 3 to match the push filters above.
            LATEST=$(git ls-remote --heads "https://github.com/${ORG}/${OPERATOR_REPO_NAME}.git" 'refs/heads/rhoai-*' \
              | sed 's|.*refs/heads/rhoai-||' \
              | grep -E '^[23]\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n \
              | tail -1)
            if [[ -z "$LATEST" ]]; then
              echo "::error::No rhoai-X.Y branches found. Cannot determine a default release branch."
              exit 1
            fi
            RELEASE_BRANCH="rhoai-${LATEST}"
            RBC_REF="$RBC_FALLBACK_BRANCH"
            echo "::warning::Non-release branch '${BRANCH}' - no rhoai-version given, guessing ${RELEASE_BRANCH} from the newest rhoai-X.Y branch. RBC read from ${RBC_REF}. Pass rhoai-version to pin this."
          fi

          {
            echo "branch=${BRANCH}"
            echo "release_branch=${RELEASE_BRANCH}"
            echo "rbc_ref=${RBC_REF}"
            echo "operator_ref=${OPERATOR_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout RBC repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/${{ env.RBC_REPO_NAME }}
          ref: ${{ steps.config.outputs.rbc_ref }}
          path: RBC
          sparse-checkout: |
            bundle/bundle-patch.yaml
          sparse-checkout-cone-mode: false
      - name: Git checkout utils
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/${{ env.UTILS_REPO_NAME }}
          ref: main
          path: utils
          sparse-checkout: |
            utils/operator-processor
          sparse-checkout-cone-mode: false
      - name: Git checkout operator repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.GITHUB_ORG }}/${{ env.OPERATOR_REPO_NAME }}
          ref: ${{ steps.config.outputs.operator_ref }}
          # EG runs push with the bot PAT instead of the default GITHUB_TOKEN: the pinned-digest commit this job pushes is what the early-gate build is supposed to build, and a GITHUB_TOKEN push is deliberately muted by GitHub
          # Scoped to EG mode on purpose - release runs push to rhoai-X.Y, which this workflow triggers on, so a PAT there would make the processor retrigger itself forever. No workflow triggers on eg-*, so the EG path cannot loop.
          token: ${{ inputs.eg-mode == 'true' && secrets.RHODS_CI_BOT_TOKEN || github.token }}
          path: rhods-operator
          sparse-checkout: |
            build
            prefetched-manifests
            prefetched-charts
            .tekton
          sparse-checkout-cone-mode: false
      - name: Install dependencies
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/')"
          yq_version="v4.44.3"
          yq_filename="yq-$yq_version"
          echo "-> Downloading yq" >&2
          curl -sSfLo "$yq_filename" "https://github.com/mikefarah/yq/releases/download/$yq_version/yq_${os}_${arch}"
          chmod +x $yq_filename
          ln -s $yq_filename yq
          cp $yq_filename /usr/local/bin/yq
  
          pip install --default-timeout=100 -r utils/utils/operator-processor/requirements.txt

      # The processor reads image digests and git labels from Quay. Quay's /api/v1 REST API only accepts OAuth application tokens, which the release robot cannot mint, so the processor uses the /v2/ registry API via skopeo instead.
      - name: Authenticate to Quay registry
        env:
          QUAY_PULL_SECRET: ${{ secrets.QUAY_PULL_SECRET || secrets.RHOAI_QUAY_API_TOKEN }}
        run: |
          set -euo pipefail

          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
          fi
          skopeo --version

          if [[ -z "${QUAY_PULL_SECRET}" ]]; then
            echo "::error::No Quay credentials. Set the QUAY_PULL_SECRET repository secret to the 'RHOAI Quay ReadOnly bot' pull secret."
            exit 1
          fi

          AUTHFILE="${RUNNER_TEMP}/quay-auth.json"

          # Accept whichever form the credential was copied in: a full .dockerconfigjson, a base64 'user:password', or a bare 'user:password'. Nothing here echoes it.
          if printf '%s' "${QUAY_PULL_SECRET}" | jq -e '.auths' >/dev/null 2>&1; then
            echo "Credential recognised as .dockerconfigjson"
            printf '%s' "${QUAY_PULL_SECRET}" > "${AUTHFILE}"
          else
            CREDS="${QUAY_PULL_SECRET}"
            if [[ "${CREDS}" != *:* ]]; then
              CREDS=$(printf '%s' "${CREDS}" | base64 -d 2>/dev/null || true)
            fi
            if [[ "${CREDS}" != *:* ]]; then
              echo "::error::Credential is not .dockerconfigjson, base64 'user:password', or 'user:password'."
              exit 1
            fi
            echo "Credential recognised as user:password"
            printf '%s' "${CREDS#*:}" | skopeo login --authfile "${AUTHFILE}" \
              -u "${CREDS%%:*}" --password-stdin quay.io
          fi

          chmod 600 "${AUTHFILE}"
          echo "REGISTRY_AUTH_FILE=${AUTHFILE}" >> "$GITHUB_ENV"

      - name: Execute Operator Processor
        env:
          # release_branch, not the raw branch: the processor passes this straight to the Quay tag filter, so a non-release branch name would match no tags.
          BRANCH: ${{ steps.config.outputs.release_branch }}
          # 'skopeo' uses the /v2/ registry API and REGISTRY_AUTH_FILE above; 'api' uses /api/v1 and needs a Quay OAuth application token.
          QUAY_BACKEND: skopeo
          RHOAI_QUAY_API_TOKEN: ${{ secrets.RHOAI_QUAY_API_TOKEN }}
        run: |
          RHOAI_VERSION=v${BRANCH/rhoai-/}
          COMPONENT_SUFFIX=${RHOAI_VERSION//./-}
          ODH_OPERATOR_COMPONENT_NAME=odh-operator-${COMPONENT_SUFFIX}
          PUSH_PIPELINE_PATH=rhods-operator/.tekton/${ODH_OPERATOR_COMPONENT_NAME}-push.yaml
          
          PATCH_YAML_PATH=RBC/bundle/bundle-patch.yaml
          OPERANDS_MAP_PATH=rhods-operator/build/operands-map.yaml
          NUDGING_YAML_PATH=rhods-operator/build/operator-nudging.yaml
          MANIFEST_CONFIG_PATH=rhods-operator/build/manifests-config.yaml
          
          # Enabling the release push pipeline is release management, and an EG run is not a release: its ephemeral branch is deleted as soon as the build finishes, the push pipeline's own CEL requires target_branch == rhoai-X.Y, and when the branch is forked from main the file is not present at all.
          PUSH_PIPELINE_ARGS=(--push-pipeline-yaml-path "${PUSH_PIPELINE_PATH}" --push-pipeline-operation enable)
          if [[ "${{ inputs.eg-mode }}" == "true" ]]; then
            echo "EG mode - leaving ${PUSH_PIPELINE_PATH} alone"
            PUSH_PIPELINE_ARGS=()
          fi

          python3 utils/utils/operator-processor/operator-processor.py  -op process-operator-yamls --patch-yaml-path ${PATCH_YAML_PATH} --operands-map-path ${OPERANDS_MAP_PATH} --nudging-yaml-path ${NUDGING_YAML_PATH} --manifest-config-path ${MANIFEST_CONFIG_PATH} --rhoai-version ${BRANCH} "${PUSH_PIPELINE_ARGS[@]}"
          
      - name: Print debug logs
        if: always()
        run: |
          LOG_FILE="${{ env.LOG_FILE_DIR }}/${{ env.LOG_FILE_NAME }}"
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
          else
            echo "Log file not found at $LOG_FILE"
          fi

      - name: Fetch all manifests
        env:
          BRANCH: ${{ steps.config.outputs.release_branch }}
        run: |
          #!/bin/bash
          set -e
          echo "current dir = $(pwd)"
          MANIFEST_CONFIG_PATH=${{ github.workspace }}/rhods-operator/build/manifests-config.yaml
          PREFETCHED_MANIFEST_DIR_PATH="rhods-operator/prefetched-manifests"
          PREFETCHED_CHARTS_DIR_PATH="rhods-operator/prefetched-charts"

          # Clean up old prefetched manifests and charts
          if [ -d "$PREFETCHED_MANIFEST_DIR_PATH" ]; then
              echo "Cleaning up old prefetched manifests..."
              rm -rf "$PREFETCHED_MANIFEST_DIR_PATH"
          fi
          if [ -d "$PREFETCHED_CHARTS_DIR_PATH" ]; then
              echo "Cleaning up old prefetched charts..."
              rm -rf "$PREFETCHED_CHARTS_DIR_PATH"
          fi

          # Create fresh directories
          mkdir -p "$PREFETCHED_MANIFEST_DIR_PATH"
          mkdir -p "$PREFETCHED_CHARTS_DIR_PATH"
          mkdir -p manifests
          cd manifests
          while IFS= read -r value;
          do
              value=${value/- /}
              component=$value

              # Skip empty keys
              [[ -z "$component" ]] && continue
               
              echo "=============================================================="
              echo "Fetching Manifest for component: $component"
              echo "=============================================================="
              if [[ -n $component ]]
              then	
                  git_url=$(value="$value" yq '.map[strenv(value)]["git.url"]' ${MANIFEST_CONFIG_PATH})
                  git_commit=$(value="$value" yq '.map[strenv(value)]["git.commit"]' ${MANIFEST_CONFIG_PATH})
                  ref_type=$(value="$value" yq '.map[strenv(value)]["ref_type"]' ${MANIFEST_CONFIG_PATH})

                  # If ref_type is branch, resolve the actual commit SHA
                  if [[ "$ref_type" == "branch" ]]; then
                    # Fetch latest commit SHA for the branch from remote
                    git_commit=$(git ls-remote "$git_url" "refs/heads/$BRANCH" | awk '{print $1}')
                    echo "Resolved git.commit for branch '$BRANCH' to commit SHA $git_commit"

                    # strenv() for both the component key and the new SHA: --arg is unsupported in this yq version and would create an empty "" key.
                    value="$value" git_commit="$git_commit" yq -i eval '.map[strenv(value)]["git.commit"] = strenv(git_commit)' ${MANIFEST_CONFIG_PATH}

                  fi

                  src=$(value="$value" yq '.map[strenv(value)]["src"]' ${MANIFEST_CONFIG_PATH})
                  dest=$(value="$value" yq '.map[strenv(value)]["dest"]' ${MANIFEST_CONFIG_PATH})
                  entry_type=$(value="$value" yq '.map[strenv(value)]["type"] // "manifest"' ${MANIFEST_CONFIG_PATH})

                  # Route to the correct output directory based on type
                  if [[ "$entry_type" == "chart" ]]; then
                    PREFETCHED_DIR_PATH="${PREFETCHED_CHARTS_DIR_PATH}"
                  else
                    PREFETCHED_DIR_PATH="${PREFETCHED_MANIFEST_DIR_PATH}"
                  fi

                  echo "component = $component"
                  echo "git_url = $git_url"
                  echo "git_commit = $git_commit"
                  echo "src = $src"
                  echo "dest = $dest"
                  echo "type = $entry_type"

                  mkdir -p $component
                  cd $component

                  git config --global init.defaultBranch ${BRANCH}
                  git init
                  git remote add origin $git_url
                  git config core.sparseCheckout true
                  git config core.sparseCheckoutCone false
                  echo "$src" >> .git/info/sparse-checkout
                  git fetch --depth=1 origin $git_commit
                  git checkout $git_commit

                  cd ../
                  echo "current dir = $(pwd)"

                  dest_dir_path=${{ github.workspace }}/${PREFETCHED_DIR_PATH}/$dest
                  mkdir -p ${dest_dir_path}

                  cp -r $component/$src/* ${dest_dir_path}
                  echo ""
              fi
          done < <(yq e '.map | keys' ${MANIFEST_CONFIG_PATH} )
          
          echo "=== Prefetched Manifests ==="
          cd ${{ github.workspace }}/${PREFETCHED_MANIFEST_DIR_PATH}
          tree
          echo "=== Prefetched Charts ==="
          cd ${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}
          tree

      - name: Fetch all charts
        env:
          BRANCH: ${{ steps.config.outputs.release_branch }}
        run: |
          #!/bin/bash
          set -e
          echo "current dir = $(pwd)"
          CHARTS_CONFIG_PATH=${{ github.workspace }}/rhods-operator/build/charts-config.yaml
          PREFETCHED_CHARTS_DIR_PATH="rhods-operator/prefetched-charts"

          # Create directory if not already created by the manifests step
          mkdir -p "$PREFETCHED_CHARTS_DIR_PATH"
          mkdir -p charts
          cd charts
          while IFS= read -r value;
          do
              value=${value/- /}
              component=$value

              # Skip empty keys
              [[ -z "$component" ]] && continue
               
              echo "=============================================================="
              echo "Fetching Chart for component: $component"
              echo "=============================================================="
              if [[ -n $component ]]
              then	
                  git_url=$(value="$value" yq '.map[strenv(value)]["git.url"]' ${CHARTS_CONFIG_PATH})
                  git_commit=$(value="$value" yq '.map[strenv(value)]["git.commit"]' ${CHARTS_CONFIG_PATH})
                  ref_type=$(value="$value" yq '.map[strenv(value)]["ref_type"]' ${CHARTS_CONFIG_PATH})

                  if [[ "$ref_type" == "branch" ]]; then
                    git_commit=$(git ls-remote "$git_url" "refs/heads/$BRANCH" | awk '{print $1}')
                    echo "Resolved git.commit for branch '$BRANCH' to commit SHA $git_commit"

                    value="$value" git_commit="$git_commit" yq -i eval '.map[strenv(value)]["git.commit"] = strenv(git_commit)' ${CHARTS_CONFIG_PATH}
                  fi

                  src=$(value="$value" yq '.map[strenv(value)]["src"]' ${CHARTS_CONFIG_PATH})
                  dest=$(value="$value" yq '.map[strenv(value)]["dest"]' ${CHARTS_CONFIG_PATH})
                  
                  echo "component = $component"
                  echo "git_url = $git_url"
                  echo "git_commit = $git_commit"
                  echo "src = $src"
                  echo "dest = $dest"
          
                  mkdir -p $component
                  cd $component
          
                  git config --global init.defaultBranch ${BRANCH}
                  git init
                  git remote add origin $git_url
                  git config core.sparseCheckout true
                  git config core.sparseCheckoutCone false
                  echo "$src" >> .git/info/sparse-checkout
                  git fetch --depth=1 origin $git_commit
                  git checkout $git_commit
          
                  cd ../
                  echo "current dir = $(pwd)"
                  
                  dest_dir_path=${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}/$dest
                  mkdir -p ${dest_dir_path}

                  cp -r $component/$src/* ${dest_dir_path}
                  echo ""
              fi
          done < <(yq e '.map | keys' ${CHARTS_CONFIG_PATH} )
          
          cd ${{ github.workspace }}/${PREFETCHED_CHARTS_DIR_PATH}
          tree

      - name: Commit and push the changes to release branch
        working-directory: rhods-operator
        env:
          EG_MODE: ${{ inputs.eg-mode }}
          TARGET_REF: ${{ steps.config.outputs.operator_ref }}
        run: |
          set -euo pipefail

          git config user.name "Openshift-AI DevOps"
          git config user.email "openshift-ai-devops@redhat.com"
          git add -A

          # An early-gate run must push even when it has nothing to say.
          # The ephemeral branch inherits build/operands-map.yaml from its fork source, and when that is already current the processor recomputes byte-identical content, nothing stages, and the short-circuit below skips the push.
          # No push means the early-gate push PipelineRun never fires, and monitor-operator-build then polls for a check-run that cannot appear until it times out - a legitimate no-op reported as a 90-minute failure.
          # The ephemeral branch is throwaway and the gate's finally task deletes it, so an empty commit costs one redundant build and nothing else.
          # Release runs keep the original behaviour: they push to rhoai-X.Y, where an empty commit is noise and would retrigger this workflow.
          # The message prefix is load-bearing - the eg-push CEL matches on it to tell this commit from the push that created the branch. Keep them in step.
          if [[ "${EG_MODE}" == "true" ]]; then
            git commit --allow-empty \
              -m "early-gate: pin component digests for ${TARGET_REF}"
            git push origin "HEAD:${TARGET_REF}"
          else
            git diff --staged --quiet || (git commit -m "Updating the operator repo with latest images and manifests" && git push origin "HEAD:${TARGET_REF}")
          fi

      # PR-only: PaC triggers the pull-request pipeline off this comment, the same way early-gate is driven by /early-gate.
      - name: Post /build-konflux comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RHODS_CI_BOT_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body '/build-konflux'

      # There is deliberately no EG equivalent of the step above. In EG mode this workflow is dispatched from early-gate/early-gate-component-pipeline.yaml in red-hat-data-services/konflux-central, whose build task runs after trigger-operator-processor returns - the build is the next task in the same PipelineRun, so posting /test here would start a second, redundant build of the same commit.

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-processor-output
          path: ${{ env.LOG_FILE_DIR }}/${{ env.LOG_FILE_NAME }}
          if-no-files-found: warn
          retention-days: 30
